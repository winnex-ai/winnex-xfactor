[build-system]
requires = ["scikit-build-core[pyproject]>=1.0", "pybind11>=2.12", "cmake>=3.20", "auditwheel>=5.0", "numpy>=1.20"]
build-backend = "scikit_build_core.build"

[project]
name = "winnex-xfactor"
# Versao derivada da tag git — nao hardcoded. O literal ja divergiu do pacote
# (pyproject 1.0.5, __init__ 1.0.4).
dynamic = ["version"]
description = "Deterministic manifold embedding for native LLM inference — the X-Factor operator (O(D²r) power iteration, no training)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Winnex Brasil Soluções Empresariais LTDA-ME", email = "pay@winnex.ai" },
]
keywords = [
    "x-factor", "manifold", "embedding", "llm", "inference", "spectral",
    "eigenvalue", "power-iteration", "deterministic", "winnex", "madhava",
    "semantic", "dimension-reduction",
]
classifiers = [
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.20",
]

[project.urls]
Homepage = "https://winnex.ai"
Source = "https://github.com/winnex-ai/winnex-xfactor"

# Formato do scikit-build-core >= 1.0. `provider` precisa ser a unica chave:
# o provider rejeita settings extras com "No inline configuration is supported".
[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.scikit-build]
minimum-version = "1.0"
build-dir = "build/{wheel_tag}"
cmake.version = ">=3.20"
wheel.packages = ["python/winnex_xfactor"]
sdist.include = [
    "include/**",
    "src/**",
    "bindings/**",
    "CMakeLists.txt",
    "pyproject.toml",
    "README.md",
    "LICENSE",
]

[tool.scikit-build.cmake.define]
WINNEX_XFACTOR_BUILD_TESTS = "OFF"
WINNEX_XFACTOR_BUILD_PYTHON = "ON"

[tool.cibuildwheel]
# CPython 3.10–3.13. Sem esta seção o CI anterior publicava só cp312 (o
# CIBW_BUILD do workflow fixava `cp312-manylinux_x86_64`, e os três jobs da
# matriz construíam o mesmo wheel).
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_*"
test-command = "python -c \"import winnex_xfactor; print(winnex_xfactor.__version__)\""
test-requires = "numpy"
build-verbosity = 1

[tool.cibuildwheel.linux]
# x86_64 apenas: aarch64 roda sob emulação QEMU no runner x86_64 e, com 4
# ABIs × compilação C++, estoura o tempo do job.
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
# macos-14 é arm64; x86_64 sairia por cross-compile e dobra o tempo
archs = ["arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.setuptools]
package-dir = { "" = "python" }
